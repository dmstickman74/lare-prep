<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — ASLA LARE Prep</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/logos/asla-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: var(--warm-cream, #F4F2ED);
    }
    .login-card {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 4px 24px rgba(0, 58, 73, .08);
    }
    .login-mark {
      width: 27px;
      height: 38px;
      margin-bottom: 24px;
    }
    .login-eyebrow {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--asla-teal, #003A49);
      margin-bottom: 8px;
    }
    .login-title {
      margin: 0 0 8px;
      font-weight: 600;
      font-size: 28px;
      color: var(--asla-teal, #003A49);
    }
    .login-sub {
      color: #555;
      font-size: 14px;
      margin: 0 0 24px;
      line-height: 1.5;
    }
    .login-btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 12px 16px;
      background: var(--asla-teal, #003A49);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .login-btn:hover { background: #002730; }
    .login-error {
      margin-top: 16px;
      padding: 10px 14px;
      background: rgba(229, 57, 53, .08);
      color: #b54a30;
      border-radius: 8px;
      font-size: 13px;
    }
    .login-foot {
      margin-top: 24px;
      font-size: 12px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <img src="assets/logos/asla-mark-green-black.png" alt="ASLA" class="login-mark" width="27" height="38">
      <div class="login-eyebrow">ASLA LARE Prep</div>
      <h1 class="login-title">Sign in</h1>
      <p class="login-sub">Sign in with your ASLA member account to access study materials and save your progress.</p>
      <a class="login-btn" href="#" id="login-btn">Sign in with ASLA Account</a>
      <div class="login-error" id="login-error" style="display:none"></div>
      <div class="login-foot">Not an ASLA member? <a href="https://www.asla.org/join" rel="noopener">Join ASLA</a>.</div>
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      /* Only accept same-origin redirects expressed as an absolute path.
         Rejects http://evil, //evil, javascript:, etc. Server also validates,
         but client-side check prevents phishing-grade visual confusion. */
      const raw = params.get('redirect') || '/';
      const redirect = /^\/(?!\/)/.test(raw) ? raw : '/';
      const errorMap = {
        missing_token:   'Sign-in was missing a token. Please try again.',
        invalid_token:   'Your sign-in link was invalid or has expired. Please try again.',
        user_mismatch:   'The Impexium user did not match the sign-in request.',
        not_approved:    'Your ASLA account is not approved.',
        no_membership:   'You need an active ASLA membership to access LARE Prep.',
        sso_failed:      'Sign-in failed. Please try again.',
        config:          'The site is not configured for sign-in yet. Contact ASLA.',
      };
      const errKey = params.get('error');
      if (errKey && errorMap[errKey]) {
        const el = document.getElementById('login-error');
        el.textContent = errorMap[errKey];
        el.style.display = 'block';
      }
      document.getElementById('login-btn').href =
        '/api/auth/login?redirect=' + encodeURIComponent(redirect);
    })();
  </script>
</body>
</html>
