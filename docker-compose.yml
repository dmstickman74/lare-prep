# lareprep stack: API container (serves /api/* + static) + dedicated Postgres.
# Host Caddy on the portainer-proxy_proxy network reverse-proxies to
# lareprep-api:4001.
#
# IMPORTANT (per VM convention): always reference Postgres by container_name
# (lareprep-postgres). Do NOT use the service name "postgres" in DATABASE_URL —
# the shared portainer-proxy_proxy network has another stack's Postgres aliased
# as bare "postgres" and Docker DNS will silently send you there.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: lareprep-api:latest
    container_name: lareprep-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://lareprep:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@lareprep-postgres:5432/lareprep
      HOST: 0.0.0.0
      PORT: 4001
      STATIC_ROOT: /app/public
      NODE_ENV: ${NODE_ENV:-production}
      DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-false}
      APP_URL: ${APP_URL:?set APP_URL in .env, e.g. https://lareprep.aslalabs.org}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (48+ random chars, openssl rand -base64 36)}
      IMPEXIUM_APP_NAME: ${IMPEXIUM_APP_NAME:?set IMPEXIUM_APP_NAME in .env}
      IMPEXIUM_APP_KEY: ${IMPEXIUM_APP_KEY:?set IMPEXIUM_APP_KEY in .env}
      IMPEXIUM_APP_ID: ${IMPEXIUM_APP_ID:?set IMPEXIUM_APP_ID in .env}
      IMPEXIUM_APP_PASSWORD: ${IMPEXIUM_APP_PASSWORD:?set IMPEXIUM_APP_PASSWORD in .env}
      IMPEXIUM_APP_USER_EMAIL: ${IMPEXIUM_APP_USER_EMAIL:?set IMPEXIUM_APP_USER_EMAIL in .env}
      IMPEXIUM_APP_USER_PASSWORD: ${IMPEXIUM_APP_USER_PASSWORD:?set IMPEXIUM_APP_USER_PASSWORD in .env}
      IMPEXIUM_CLIENT_URL: ${IMPEXIUM_CLIENT_URL:?set IMPEXIUM_CLIENT_URL in .env, e.g. https://my.asla.org}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - proxy

  postgres:
    image: postgres:18-alpine
    container_name: lareprep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lareprep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: lareprep
    volumes:
      # Postgres 18+ wants the whole /var/lib/postgresql tree, not just /data,
      # so it can put data under a version-named subdir for future pg_upgrade.
      - lareprep-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lareprep -d lareprep"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  lareprep-pgdata:

networks:
  internal:
  proxy:
    name: portainer-proxy_proxy
    external: true
